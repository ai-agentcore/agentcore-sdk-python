[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alibabacloud-agentcore-memory-plugin"
version = "0.1.0"
description = "Optional event capture and recall through an AgentCore Memory gateway"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_memory_plugin"]
