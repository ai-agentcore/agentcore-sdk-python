[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alibabacloud-agentcore-sdk"
version = "0.1.1"
description = "Python runtime SDK for Alibaba Cloud AgentCore high-code agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "alibabacloud-agentcore20260804==1.2.1",
  "anthropic>=1,<2",
  "anyio>=4.4,<5",
  "httpx>=0.27,<1",
  "litellm==1.95.0; python_version < '3.11'",
  "litellm>=1.95.0,<2; python_version >= '3.11'",
  "openai>=2,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
collaboration = ["alibabacloud-agentcore-collaboration>=0.1.0,<1"]
mcp = ["mcp>=1.21.2,<2"]
server = [
  "ag-ui-protocol>=0.1.10,<1",
  "fastapi>=0.104,<1",
  "uvicorn>=0.24",
]
credentials = [
  "alibabacloud-agentidentitydata20251127>=2.0,<3",
  "alibabacloud-tea-openapi>=0.3",
]
langchain = [
  "langchain>=1,<2",
  "langchain-anthropic>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
]
langgraph = [
  "langchain-anthropic>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
]
agentscope = ["agentscope>=2,<3; python_version >= '3.11'"]
google-adk = ["google-adk[extensions]>=1.18"]
pydantic-ai = ["pydantic-ai>=1.22"]
crewai = [
  "crewai>=1.15.20",
  "onnxruntime==1.23.2; python_version == '3.10'",
]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore"]

[tool.uv.sources]
alibabacloud-agentcore-collaboration = { workspace = true }

[tool.uv.workspace]
members = ["packages/collaboration"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentcore", "agentcore_collaboration"]

[[tool.mypy.overrides]]
module = [
  "agentscope.*",
  "alibabacloud_agentcore20260804.*",
  "alibabacloud_tea_openapi.*",
  "crewai.*",
  "google.adk.*",
  "google.genai.*",
  "langchain_core.*",
  "langchain_anthropic.*",
  "langchain_openai.*",
  "litellm.*",
  "mcp.*",
  "pydantic_ai.*",
]
ignore_missing_imports = true
