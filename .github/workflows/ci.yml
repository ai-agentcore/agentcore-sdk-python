name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            framework: langchain-langgraph
            extra: ''
          - python: '3.11'
            framework: langchain-langgraph
            extra: ''
          - python: '3.12'
            framework: langchain-langgraph
            extra: ''
          - python: '3.11'
            framework: agentscope
            extra: ',agentscope'
          - python: '3.11'
            framework: google-adk
            extra: ',google-adk'
          - python: '3.11'
            framework: pydantic-ai
            extra: ',pydantic-ai'
          - python: '3.11'
            framework: crewai
            extra: ',crewai'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/collaboration/pyproject.toml
      - name: Install test dependencies
        env:
          FRAMEWORK_EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,server,credentials,langchain,langgraph${FRAMEWORK_EXTRA}]" -e ./packages/collaboration
          python -m pip check
      - name: Unit, local protocol and framework tests
        run: python -m pytest tests/unit tests/integration tests/optional -q --tb=short

  packages:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Build and validate both packages
        run: |
          python -m build
          python -m build packages/collaboration
          python -m twine check --strict dist/* packages/collaboration/dist/*
